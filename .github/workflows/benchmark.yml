# Benchmark (recall regression gate) — Phase 11.
#
# Nightly + on-demand: boots the pinned OWASP Juice Shop version, runs the
# recall harness (benchmark/run-recall-benchmark.mjs) against the DEFAULT
# `testigator check` surface, and FAILS the job when deterministic recall
# drops below 100% or a must-not-find (false-positive guard) fires.
#
# The badge in README.md tracks this workflow. Receipts (recall .json/.md)
# are uploaded as artifacts on every run.
name: Benchmark (recall regression gate)

on:
  schedule:
    - cron: '17 3 * * *' # daily, off the top of the hour
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  recall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SHA-pinned to the release commit (audit L-7) — update procedure: README → "Supply-chain pinning".
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies + Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Boot OWASP Juice Shop (digest-pinned v20.4.0, ctf.key mounted)
        run: |
          # Digest-pinned (audit L-7): manifest-list digest for the v20.4.0 tag,
          # valid on amd64 and arm64 runners.
          docker run -d --name juice-shop -p 3000:3000 \
            -v "$GITHUB_WORKSPACE/benchmark/ctf.key:/juice-shop/ctf.key" \
            bkimminich/juice-shop@sha256:9bbaecc41791f00b002bc65931cc5ff355fbdb941fa72b06558c18dace43197b

      - name: Wait for Juice Shop
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Juice Shop is up (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          docker logs juice-shop || true
          echo "Juice Shop did not come up within 60s"
          exit 1

      - name: Recall benchmark (fails on any regression)
        env:
          SQA_ALLOW_PRIVATE: 'true'
          ALLOW_PRIVATE_HOSTS: 'true'
        run: |
          node benchmark/run-recall-benchmark.mjs \
            --base-url http://localhost:3000 \
            --max-pages 12 --max-depth 2 \
            --timeout 2400000 \
            --min-recall 1.0

      - name: Upload benchmark receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recall-receipt
          path: |
            benchmark/results/*-recall.json
            benchmark/results/*-recall.md
          retention-days: 30
